name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, GPU + VRAM, Python/Node version, TTS/STT engine used
      placeholder: |
        OS: Linux Mint 22
        GPU: RTX 3050 Ti, 4 GB
        Python: 3.11
        Node: 18
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Redact any secrets, tokens, IPs or local file paths before pasting.
